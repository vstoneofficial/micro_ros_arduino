name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  esp32:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 0.32.3
      - name: Install the supported ESP32 core
        run: |
          python3 -m pip install pyserial==3.5
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.13
      - name: Compile standard and AMIR messages (single application slot)
        run: |
          for sketch in micro-ros_publisher micro-ros_publisher_wifi micro-ros_reconnection_example micro-ros_amir; do
            arduino-cli compile --fqbn esp32:esp32:${{ matrix.board }}:PartitionScheme=no_ota \
              --library "$GITHUB_WORKSPACE" "examples/$sketch"
          done
