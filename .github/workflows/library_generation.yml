name: Library generator

on:
  workflow_dispatch:

jobs:
  jazzy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild pinned Jazzy libraries with AMIR and encoder messages
        run: |
          docker run --rm -v "$PWD:/project" --env MICROROS_LIBRARY_FOLDER=extras \
            "$(cat extras/library_generation/builder-image.txt)" -p esp32 -p esp32s3
          sudo chown -R "$(id -u):$(id -g)" src built_packages available_ros2_types
      - uses: actions/upload-artifact@v4
        with:
          name: micro_ros_arduino-2.0.8-jazzy-vstone
          path: |
            src/
            extras/
            examples/
            library.properties
            README.md
            LICENSE
            NOTICE
            3rd-party-licenses.txt
            built_packages
            available_ros2_types
